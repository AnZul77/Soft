version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: investment_intelligence_db
    restart: always
    environment:
      POSTGRES_DB: investment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: investment_intelligence_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: investment_intelligence_api
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/investment_db
      SECRET_KEY: super-secret-production-jwt-key-investment-platform-2026
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: investment_intelligence_ui
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
